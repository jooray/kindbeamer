name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter build linux --release
      # A tarball rather than the raw directory: the zip GitHub would make of it
      # loses the executable bit, and this is what ships on the release.
      - name: Package the bundle
        run: |
          tar -czf kindbeamer-linux-x64.tar.gz \
            -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: kindbeamer-linux-x64
          path: kindbeamer-linux-x64.tar.gz

  linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-24.04-arm
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            git curl unzip xz-utils
      # Flutter publishes no arm64 Linux SDK archive, so the SDK comes from git.
      # The arm64 engine artifacts it then downloads do exist.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package the bundle
        run: |
          tar -czf kindbeamer-linux-arm64.tar.gz \
            -C build/linux/arm64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: kindbeamer-linux-arm64
          path: kindbeamer-linux-arm64.tar.gz

  android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Debug-signed: release signing is left to whoever packages a release.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kindbeamer-android
          path: build/app/outputs/flutter-apk/app-release.apk

  macos:
    name: Build macOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent KindBeamer.app KindBeamer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kindbeamer-macos
          path: build/macos/Build/Products/Release/KindBeamer-macos.zip
